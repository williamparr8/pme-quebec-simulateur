<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PME Québec : un jeu de simulation d'affaires pour apprendre à gérer une PME au Québec (marketing, RH, finance, comptabilité, fiscalité)."
    />
    <meta name="theme-color" content="#0b5cd5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='10' width='28' height='20' rx='3' fill='%230b5cd5'/%3E%3Crect x='6' y='2' width='20' height='10' rx='2' fill='%23f59e0b'/%3E%3Crect x='12' y='18' width='8' height='12' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>PME Québec : Le Simulateur d'affaires</title>
    <script>
      // Applique le thème avant l'affichage pour éviter un flash de couleur.
      (function () {
        var theme = 'systeme';
        try {
          var p = JSON.parse(localStorage.getItem('pme-quebec:preferences') || '{}');
          if (p.theme) theme = p.theme;
        } catch (e) {}
        var sombre =
          theme === 'sombre' ||
          (theme === 'systeme' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = sombre ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="racine"></div>
    <noscript>Ce jeu nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
